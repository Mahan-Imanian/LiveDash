<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LiveDash Quick Panel</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body data-page="popup">
  <main class="popup-shell">
    <section class="popup-card popup-top">
      <div><span class="eyebrow">LiveDash</span><div class="popup-time" id="popupTime">--:--</div><p id="popupDate">Loading</p></div>
      <button id="openDashboard" type="button">Open</button>
    </section>
    <section class="popup-card">
      <label class="sr-only" for="popupSearch">Search</label>
      <input id="popupSearch" class="popup-search" type="search" placeholder="Search or paste URL">
    </section>
    <section class="popup-card">
      <div class="section-title-row"><div><span class="eyebrow">Focus</span><h2>Timer</h2></div><strong id="popupFocus">25:00</strong></div>
      <div class="popup-actions"><button id="popupStartFocus" type="button">Start focus</button><button id="popupStopFocus" type="button">Stop</button></div>
    </section>
    <section class="popup-card">
      <div class="section-title-row"><div><span class="eyebrow">Tasks</span><h2>Top priorities</h2></div><button id="popupAddTask" type="button">Add</button></div>
      <div id="popupTasks" class="list-stack"></div>
    </section>
    <section class="popup-card">
      <label class="sr-only" for="popupNote">Quick note</label>
      <textarea id="popupNote" class="popup-note" placeholder="Capture a quick note"></textarea>
      <button id="popupSaveNote" class="primary-wide" type="button">Save note</button>
    </section>
    <section class="popup-card popup-actions">
      <button id="popupCommand" type="button">Command</button>
      <button id="popupSettings" type="button">Settings</button>
    </section>
  </main>
  <script src="scripts/default-state.js"></script>
  <script src="scripts/storage.js"></script>
  <script src="scripts/popup.js"></script>
</body>
</html>
