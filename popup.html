<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LiveDash Quick Panel</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body data-surface="popup">
  <main class="popup-shell" aria-label="LiveDash quick panel">
    <header class="popup-header">
      <span class="brand-mark small" aria-hidden="true"></span>
      <div><h1>LiveDash</h1><p>Quick command panel</p></div>
    </header>
    <section class="popup-status" aria-label="Current status">
      <div><span>Time</span><strong id="popupClock">--:--</strong></div>
      <div><span>Focus</span><strong id="popupFocus">Off</strong></div>
      <div><span>View</span><strong id="popupView">Overview</strong></div>
    </section>
    <section class="popup-section">
      <label class="field" for="popupSearch"><span>Search or command</span><input id="popupSearch" type="search" placeholder="Search Google or type /task"></label>
    </section>
    <section class="popup-section">
      <div class="popup-section-title">Top tasks</div>
      <div class="popup-list" id="popupTasks"></div>
    </section>
    <section class="popup-section">
      <label class="field" for="popupNote"><span>Quick note</span><textarea id="popupNote" rows="3" placeholder="Capture a thought or follow-up"></textarea></label>
    </section>
    <section class="popup-actions" aria-label="Quick actions">
      <button class="button primary" id="openDashboard" type="button">Open dashboard</button>
      <button class="button secondary" id="popupToggleFocus" type="button">Start focus</button>
      <button class="button secondary" id="popupAddTask" type="button">Add task</button>
      <button class="button secondary" id="popupSaveNote" type="button">Save note</button>
      <button class="button secondary" id="popupSettings" type="button">Settings</button>
    </section>
  </main>
  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <script src="scripts/default-state.js"></script>
  <script src="scripts/storage.js"></script>
  <script src="scripts/popup.js"></script>
</body>
</html>
